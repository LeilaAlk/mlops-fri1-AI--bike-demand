# Hypothesis (validation error analysis): max_depth 10 limits how finely the
# forest separates busy hours; unlimited depth should lower validation MAE.
# Cost to watch: a larger model file and slower predictions.
name: deeper-trees
data: data/raw/hour.csv
features: [season, yr, mnth, hr, holiday, weekday, workingday, weathersit, temp, atemp, hum, windspeed]
model:
  n_estimators: 50
  max_depth: null
  random_state: 42
  n_jobs: 1
