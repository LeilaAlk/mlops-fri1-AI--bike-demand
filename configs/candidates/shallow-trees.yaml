# Hypothesis (cost reduction): a much smaller forest (depth 4) would be tiny
# and fast. Expected risk: too simple for hourly demand, worse validation MAE.
name: shallow-trees
data: data/raw/hour.csv
features: [season, yr, mnth, hr, holiday, weekday, workingday, weathersit, temp, atemp, hum, windspeed]
model:
  n_estimators: 50
  max_depth: 4
  random_state: 42
  n_jobs: 1
